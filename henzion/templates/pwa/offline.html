{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e293b">
  <title>Offline · {{ company.name }}</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1e293b;font-family:system-ui,sans-serif;color:#334155;padding:16px}
    .card{background:#fff;border-radius:16px;max-width:360px;width:100%;padding:32px;text-align:center}
    img{width:72px;height:72px;border-radius:12px;object-fit:cover}
    h1{font-size:20px;margin:16px 0 8px}p{font-size:14px;line-height:1.5;margin:0 0 20px}
    button{background:#f6097f;color:#fff;border:0;border-radius:10px;padding:10px 20px;font-size:15px;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <img src="{% static 'img/logo.jpeg' %}" alt="">
    <h1>No internet connection</h1>
    <p>{{ company.name }} needs to be online to record sales and show live stock. Check your connection, then try again. A sale is only saved once it reaches the server.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
